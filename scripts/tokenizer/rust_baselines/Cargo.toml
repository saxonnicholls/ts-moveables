# Native Rust baselines for demos/tokenizer: tiktoken-rs and bpe-openai, one thread and rayon.
#     cd scripts/tokenizer/rust_baselines && RUSTFLAGS="-C target-cpu=native" cargo run --release -- ../../../build/tokdata
[package]
name = "rust_baselines"
version = "0.1.0"
edition = "2021"

[dependencies]
tiktoken-rs = "=0.12.1"
bpe-openai = "=0.3.2"
rayon = "=1.12.0"
base64 = "0.22"
rustc-hash = "=2.1.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
