# Native Rust baselines for demos/tokenizer: tiktoken-rs, bpe-openai, Hugging Face tokenizers, kitoken,
# splintr, goliajp's tiktoken, toktok and tokie; one thread, and batch at RAYON_NUM_THREADS threads.
#     cd scripts/tokenizer/rust_baselines && RUSTFLAGS="-C target-cpu=native" cargo build --release
#     RAYON_NUM_THREADS=8 target/release/rust_baselines ../../../build/tokdata --json <cl100k tokenizer.json> --single
# The tokenizer.json is Xenova/gpt-4's (https://huggingface.co/Xenova/gpt-4); run_comparison.sh runs it all.
[package]
name = "rust_baselines"
version = "0.1.0"
edition = "2021"

[dependencies]
tiktoken-rs = "=0.12.1"
bpe-openai = "=0.3.2"
rayon = "=1.12.0"
base64 = "0.22"
rustc-hash = "=2.1.3"
tokenizers = "=0.23.2"
kitoken = "=0.11.1"
splintr = "=0.22.2"
tiktoken = "=4.1.2"
toktok-rs = "=0.3.0"
tokie = "=0.1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
