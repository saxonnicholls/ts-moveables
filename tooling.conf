#  Copyright 2010-2026 Saxon Herschel Nicholls
#
#  The settings tooling's scripts read (third_party/tooling, README "tooling.conf"). ts-moveables runs its own version
#  and test-registry checks; it takes tooling's single include: ts_moveables.hpp (the library) and ts_http_server.hpp
#  (the HTTP server alone), each with the snicholls-core headers it uses, generated and never committed.

name          = ts-moveables
include_dir   = TSMoveables
include_root  = TSMoveables
namespace     = snicholls
umbrella      = ts_moveables.hpp

single_include.ts_moveables   = ts_moveables.hpp   # the whole library, less the opt-ins below
single_include.ts_http_server = http/server.hpp    # the HTTP server, for drop-in use the way cpp-httplib is used
single_include_inline = TSMoveables third_party/core/include

# Opt-in on purpose (one line, as tooling.conf keys appear once), adding to it should be a decision, not a way to make
# the check pass:
#   tls/openssl.hpp, tls/mbedtls.hpp, http/websocket_deflate.hpp: they link OpenSSL (-lssl -lcrypto), mbedTLS, zlib (-lz);
#   mmap/*: C++20 and POSIX, on snicholls-core's containers beyond what the single include ships;
#   fs/*: C++20 and POSIX, on core's result.hpp;
#   process/* (bar process/global.hpp, which is in it): C++20 and POSIX, on core's result and secret;
#   http/client.hpp, http/h2_client.hpp: the HTTP client returns core's result, C++20;
#   net/collective.hpp: collectives over TCP, C++20, on core's result and backoff.
single_include_opt_in = tls/openssl.hpp tls/mbedtls.hpp http/websocket_deflate.hpp mmap/mapped_error.hpp mmap/mapped_memory_resource.hpp mmap/mapped_pool.hpp mmap/mapped_region.hpp mmap/mapped_vector.hpp fs/file.hpp fs/sync.hpp process/config.hpp process/dotenv.hpp process/environment.hpp process/exit_code.hpp process/health.hpp process/http_health.hpp process/signals.hpp http/client.hpp http/h2_client.hpp net/collective.hpp   # third-party links, or C++20 + POSIX (above)
